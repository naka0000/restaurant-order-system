<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スタッフ管理 - 飲食店管理システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }

        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 0;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 24px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            background: rgba(255,255,255,0.2);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .tabs {
            display: flex;
            background: white;
            border-radius: 16px;
            padding: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .tab {
            flex: 1;
            padding: 12px 20px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            background: transparent;
            border: none;
            font-size: 16px;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            color: #1d1d1f;
        }

        .add-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .staff-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .staff-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 25px;
            transition: all 0.3s;
        }

        .staff-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .staff-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .staff-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 20px;
            margin-right: 15px;
        }

        .staff-info h3 {
            font-size: 18px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 5px;
        }

        .staff-role {
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
        }

        .staff-details {
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .staff-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .edit-btn {
            background: #e3f2fd;
            color: #1976d2;
        }

        .delete-btn {
            background: #ffebee;
            color: #d32f2f;
        }

        .schedule-section {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .schedule-header {
            background: #f8f9fa;
            padding: 20px 25px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .schedule-title {
            font-size: 20px;
            font-weight: 700;
            color: #1d1d1f;
        }

        .week-nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .week-btn {
            background: none;
            border: 2px solid #e0e0e0;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .week-btn:hover {
            background: #f0f0f0;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: 100px repeat(7, 1fr);
            border-collapse: collapse;
        }

        .schedule-cell {
            padding: 12px 8px;
            border-right: 1px solid #f0f0f0;
            border-bottom: 1px solid #f0f0f0;
            text-align: center;
            font-size: 14px;
        }

        .schedule-header-cell {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
        }

        .time-cell {
            background: #fafafa;
            font-weight: 600;
            color: #333;
        }

        .shift-cell {
            position: relative;
            min-height: 50px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .shift-cell:hover {
            background: #f8f9fa;
        }

        .shift-block {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 4px 8px;
            margin: 2px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #1d1d1f;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            padding: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .cancel-btn {
            background: #f5f5f5;
            color: #666;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .save-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .header-section {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .staff-grid {
                grid-template-columns: 1fr;
            }

            .schedule-grid {
                font-size: 12px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-title">🍽️ レストラン管理システム</div>
            <div class="nav-links">
                <a href="index.html">注文管理</a>
                <a href="dashboard.html">ダッシュボード</a>
                <a href="menu-management.html">メニュー管理</a>
                <a href="customer-management.html">顧客管理</a>
                <a href="inventory.html">在庫管理</a>
                <a href="staff-management.html" class="active">スタッフ管理</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="showTab('staff')">スタッフ管理</button>
            <button class="tab" onclick="showTab('schedule')">シフト管理</button>
        </div>

        <!-- スタッフ管理タブ -->
        <div id="staff-tab" class="tab-content active">
            <div class="header-section">
                <h1 class="header-title">スタッフ管理</h1>
                <button class="add-btn" onclick="openStaffModal('add')">
                    ➕ 新しいスタッフを追加
                </button>
            </div>

            <div class="staff-grid" id="staffGrid">
                <!-- スタッフカードがここに動的に追加されます -->
            </div>
        </div>

        <!-- シフト管理タブ -->
        <div id="schedule-tab" class="tab-content">
            <div class="schedule-section">
                <div class="schedule-header">
                    <h2 class="schedule-title">シフト管理</h2>
                    <div class="week-nav">
                        <button class="week-btn" onclick="changeWeek(-1)">← 前週</button>
                        <span id="currentWeek">2024年1月15日〜21日</span>
                        <button class="week-btn" onclick="changeWeek(1)">次週 →</button>
                        <button class="add-btn" onclick="openShiftModal()">シフト追加</button>
                    </div>
                </div>

                <div class="schedule-grid" id="scheduleGrid">
                    <!-- シフト表がここに動的に作成されます -->
                </div>
            </div>
        </div>
    </div>

    <!-- スタッフ追加/編集モーダル -->
    <div class="modal" id="staffModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="staffModalTitle">スタッフを追加</h2>
                <button class="close-btn" onclick="closeModal('staffModal')">&times;</button>
            </div>
            
            <form id="staffForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">姓</label>
                        <input type="text" class="form-input" id="staffLastName" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">名</label>
                        <input type="text" class="form-input" id="staffFirstName" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">役職</label>
                        <select class="form-input" id="staffRole" required>
                            <option value="">選択してください</option>
                            <option value="店長">店長</option>
                            <option value="副店長">副店長</option>
                            <option value="キッチン">キッチン</option>
                            <option value="ホール">ホール</option>
                            <option value="アルバイト">アルバイト</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">時給 (円)</label>
                        <input type="number" class="form-input" id="staffHourlyWage" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">電話番号</label>
                        <input type="tel" class="form-input" id="staffPhone" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">メール</label>
                        <input type="email" class="form-input" id="staffEmail">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">住所</label>
                    <input type="text" class="form-input" id="staffAddress">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">入社日</label>
                        <input type="date" class="form-input" id="staffHireDate" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">ステータス</label>
                        <select class="form-input" id="staffStatus">
                            <option value="active">勤務中</option>
                            <option value="inactive">休職中</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal('staffModal')">キャンセル</button>
                    <button type="submit" class="save-btn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- シフト追加モーダル -->
    <div class="modal" id="shiftModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">シフトを追加</h2>
                <button class="close-btn" onclick="closeModal('shiftModal')">&times;</button>
            </div>
            
            <form id="shiftForm">
                <div class="form-group">
                    <label class="form-label">スタッフ</label>
                    <select class="form-input" id="shiftStaff" required>
                        <option value="">選択してください</option>
                        <!-- スタッフ一覧が動的に追加されます -->
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">日付</label>
                    <input type="date" class="form-input" id="shiftDate" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">開始時間</label>
                        <input type="time" class="form-input" id="shiftStartTime" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">終了時間</label>
                        <input type="time" class="form-input" id="shiftEndTime" required>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal('shiftModal')">キャンセル</button>
                    <button type="submit" class="save-btn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let staff = [
            {
                id: 1,
                lastName: '田中',
                firstName: '太郎',
                role: '店長',
                hourlyWage: 1500,
                phone: '03-1234-5678',
                email: 'tanaka@restaurant.com',
                address: '東京都渋谷区',
                hireDate: '2020-04-01',
                status: 'active'
            },
            {
                id: 2,
                lastName: '佐藤',
                firstName: '花子',
                role: 'キッチン',
                hourlyWage: 1200,
                phone: '03-2345-6789',
                email: 'sato@restaurant.com',
                address: '東京都新宿区',
                hireDate: '2021-06-15',
                status: 'active'
            },
            {
                id: 3,
                lastName: '鈴木',
                firstName: '一郎',
                role: 'ホール',
                hourlyWage: 1100,
                phone: '03-3456-7890',
                email: 'suzuki@restaurant.com',
                address: '東京都世田谷区',
                hireDate: '2022-03-01',
                status: 'active'
            },
            {
                id: 4,
                lastName: '高橋',
                firstName: '美咲',
                role: 'アルバイト',
                hourlyWage: 1000,
                phone: '03-4567-8901',
                email: 'takahashi@restaurant.com',
                address: '東京都港区',
                hireDate: '2023-08-20',
                status: 'inactive'
            }
        ];

        let shifts = [
            { id: 1, staffId: 1, date: '2024-01-15', startTime: '09:00', endTime: '18:00' },
            { id: 2, staffId: 2, date: '2024-01-15', startTime: '10:00', endTime: '19:00' },
            { id: 3, staffId: 3, date: '2024-01-16', startTime: '17:00', endTime: '22:00' },
            { id: 4, staffId: 1, date: '2024-01-17', startTime: '09:00', endTime: '18:00' },
            { id: 5, staffId: 4, date: '2024-01-18', startTime: '18:00', endTime: '23:00' }
        ];

        let editingStaffId = null;
        let currentWeekStart = new Date('2024-01-15');

        function showTab(tabName, event) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');

            if (tabName === 'schedule') {
                renderSchedule();
            }
        }

        function renderStaff() {
            const grid = document.getElementById('staffGrid');
            
            grid.innerHTML = staff.map(member => `
                <div class="staff-card">
                    <div class="staff-header">
                        <div class="staff-avatar">${member.lastName.charAt(0)}</div>
                        <div class="staff-info">
                            <h3>${member.lastName} ${member.firstName}</h3>
                            <div class="staff-role">${member.role}</div>
                        </div>
                    </div>
                    
                    <div class="staff-details">
                        <div class="detail-row">
                            <span>時給:</span>
                            <span>¥${member.hourlyWage.toLocaleString()}</span>
                        </div>
                        <div class="detail-row">
                            <span>電話:</span>
                            <span>${member.phone}</span>
                        </div>
                        <div class="detail-row">
                            <span>入社日:</span>
                            <span>${formatDate(member.hireDate)}</span>
                        </div>
                    </div>
                    
                    <div class="status-badge ${member.status === 'active' ? 'status-active' : 'status-inactive'}">
                        ${member.status === 'active' ? '勤務中' : '休職中'}
                    </div>
                    
                    <div class="staff-actions">
                        <button class="action-btn edit-btn" onclick="editStaff(${member.id})">編集</button>
                        <button class="action-btn delete-btn" onclick="deleteStaff(${member.id})">削除</button>
                    </div>
                </div>
            `).join('');
        }

        function renderSchedule() {
            const grid = document.getElementById('scheduleGrid');
            const days = ['月', '火', '水', '木', '金', '土', '日'];
            const timeSlots = ['09:00', '12:00', '15:00', '18:00', '21:00'];

            // ヘッダー行
            let html = '<div class="schedule-cell schedule-header-cell">時間</div>';
            for (let i = 0; i < 7; i++) {
                const date = new Date(currentWeekStart);
                date.setDate(date.getDate() + i);
                html += `<div class="schedule-cell schedule-header-cell">${days[i]}<br>${date.getDate()}日</div>`;
            }

            // 時間スロット行
            for (const timeSlot of timeSlots) {
                html += `<div class="schedule-cell time-cell">${timeSlot}</div>`;
                
                for (let i = 0; i < 7; i++) {
                    const date = new Date(currentWeekStart);
                    date.setDate(date.getDate() + i);
                    const dateStr = date.toISOString().split('T')[0];
                    
                    const dayShifts = shifts.filter(shift => shift.date === dateStr);
                    const shiftBlocks = dayShifts.map(shift => {
                        const staffMember = staff.find(s => s.id === shift.staffId);
                        return `<div class="shift-block">${staffMember ? staffMember.lastName : 'Unknown'}<br>${shift.startTime}-${shift.endTime}</div>`;
                    }).join('');
                    
                    html += `<div class="schedule-cell shift-cell" onclick="addShiftToDay('${dateStr}')">${shiftBlocks}</div>`;
                }
            }

            grid.innerHTML = html;
            
            // 週表示を更新
            const endDate = new Date(currentWeekStart);
            endDate.setDate(endDate.getDate() + 6);
            document.getElementById('currentWeek').textContent = 
                `${currentWeekStart.getFullYear()}年${currentWeekStart.getMonth() + 1}月${currentWeekStart.getDate()}日〜${endDate.getDate()}日`;
        }

        function changeWeek(direction) {
            const newDate = new Date(currentWeekStart);
            newDate.setDate(newDate.getDate() + (direction * 7));
            currentWeekStart = newDate;
            renderSchedule();
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ja-JP');
        }

        function openStaffModal(mode, staffId = null) {
            const modal = document.getElementById('staffModal');
            const modalTitle = document.getElementById('staffModalTitle');
            const form = document.getElementById('staffForm');

            if (mode === 'add') {
                modalTitle.textContent = 'スタッフを追加';
                form.reset();
                editingStaffId = null;
            } else if (mode === 'edit') {
                modalTitle.textContent = 'スタッフを編集';
                const member = staff.find(s => s.id === staffId);
                if (member) {
                    document.getElementById('staffLastName').value = member.lastName;
                    document.getElementById('staffFirstName').value = member.firstName;
                    document.getElementById('staffRole').value = member.role;
                    document.getElementById('staffHourlyWage').value = member.hourlyWage;
                    document.getElementById('staffPhone').value = member.phone;
                    document.getElementById('staffEmail').value = member.email;
                    document.getElementById('staffAddress').value = member.address;
                    document.getElementById('staffHireDate').value = member.hireDate;
                    document.getElementById('staffStatus').value = member.status;
                    editingStaffId = staffId;
                }
            }

            modal.style.display = 'block';
        }

        function openShiftModal() {
            const modal = document.getElementById('shiftModal');
            const staffSelect = document.getElementById('shiftStaff');
            
            // スタッフ選択肢を更新
            staffSelect.innerHTML = '<option value="">選択してください</option>' +
                staff.filter(s => s.status === 'active').map(s => 
                    `<option value="${s.id}">${s.lastName} ${s.firstName}</option>`
                ).join('');
            
            document.getElementById('shiftForm').reset();
            modal.style.display = 'block';
        }

        function addShiftToDay(date) {
            openShiftModal();
            document.getElementById('shiftDate').value = date;
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            editingStaffId = null;
        }

        function editStaff(staffId) {
            openStaffModal('edit', staffId);
        }

        function deleteStaff(staffId) {
            if (confirm('このスタッフを削除してもよろしいですか？')) {
                staff = staff.filter(s => s.id !== staffId);
                shifts = shifts.filter(s => s.staffId !== staffId);
                renderStaff();
                if (document.getElementById('schedule-tab').classList.contains('active')) {
                    renderSchedule();
                }
            }
        }

        document.getElementById('staffForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const staffData = {
                lastName: document.getElementById('staffLastName').value,
                firstName: document.getElementById('staffFirstName').value,
                role: document.getElementById('staffRole').value,
                hourlyWage: parseInt(document.getElementById('staffHourlyWage').value),
                phone: document.getElementById('staffPhone').value,
                email: document.getElementById('staffEmail').value,
                address: document.getElementById('staffAddress').value,
                hireDate: document.getElementById('staffHireDate').value,
                status: document.getElementById('staffStatus').value
            };

            if (editingStaffId) {
                const staffIndex = staff.findIndex(s => s.id === editingStaffId);
                if (staffIndex !== -1) {
                    staff[staffIndex] = { ...staff[staffIndex], ...staffData };
                }
            } else {
                const newStaff = {
                    id: Date.now(),
                    ...staffData
                };
                staff.push(newStaff);
            }

            closeModal('staffModal');
            renderStaff();
        });

        document.getElementById('shiftForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const shiftData = {
                id: Date.now(),
                staffId: parseInt(document.getElementById('shiftStaff').value),
                date: document.getElementById('shiftDate').value,
                startTime: document.getElementById('shiftStartTime').value,
                endTime: document.getElementById('shiftEndTime').value
            };

            shifts.push(shiftData);
            closeModal('shiftModal');
            renderSchedule();
        });

        window.onclick = function(event) {
            const staffModal = document.getElementById('staffModal');
            const shiftModal = document.getElementById('shiftModal');
            if (event.target === staffModal) {
                closeModal('staffModal');
            }
            if (event.target === shiftModal) {
                closeModal('shiftModal');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderStaff();
        });
    </script>
</body>
</html>
