<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在庫管理 - 飲食店管理システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }

        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 0;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 24px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            background: rgba(255,255,255,0.2);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            color: #1d1d1f;
        }

        .add-item-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-item-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .alerts-section {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .alert-title {
            font-size: 18px;
            font-weight: 600;
            color: #856404;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-list {
            color: #856404;
        }

        .alert-item {
            margin-bottom: 5px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-number.low-stock {
            color: #e74c3c;
        }

        .stat-number.normal {
            color: #27ae60;
        }

        .stat-number.warning {
            color: #f39c12;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .search-filters {
            background: white;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            min-width: 200px;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-select {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .inventory-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 20px;
            transition: all 0.3s;
        }

        .inventory-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .item-name {
            font-size: 18px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 5px;
        }

        .item-category {
            font-size: 12px;
            color: #666;
            background: #f0f0f2;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .stock-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stock-amount {
            font-size: 24px;
            font-weight: 700;
        }

        .stock-amount.low {
            color: #e74c3c;
        }

        .stock-amount.warning {
            color: #f39c12;
        }

        .stock-amount.normal {
            color: #27ae60;
        }

        .stock-unit {
            color: #666;
            font-size: 14px;
        }

        .stock-bar {
            width: 100%;
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .stock-fill {
            height: 100%;
            transition: width 0.3s;
        }

        .stock-fill.low {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
        }

        .stock-fill.warning {
            background: linear-gradient(90deg, #f39c12, #e67e22);
        }

        .stock-fill.normal {
            background: linear-gradient(90deg, #27ae60, #2ecc71);
        }

        .item-details {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .update-btn {
            background: #e3f2fd;
            color: #1976d2;
        }

        .update-btn:hover {
            background: #bbdefb;
        }

        .order-btn {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .order-btn:hover {
            background: #e1bee7;
        }

        .delete-btn {
            background: #ffebee;
            color: #d32f2f;
        }

        .delete-btn:hover {
            background: #ffcdd2;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #1d1d1f;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            padding: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .cancel-btn {
            background: #f5f5f5;
            color: #666;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .save-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .header-section {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .search-filters {
                flex-direction: column;
                align-items: stretch;
            }

            .inventory-grid {
                grid-template-columns: 1fr;
            }

            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-title">🍽️ レストラン管理システム</div>
            <div class="nav-links">
                <a href="index.html">注文管理</a>
                <a href="dashboard.html">ダッシュボード</a>
                <a href="menu-management.html">メニュー管理</a>
                <a href="customer-management.html">顧客管理</a>
                <a href="inventory.html" class="active">在庫管理</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1 class="header-title">在庫管理</h1>
            <button class="add-item-btn" onclick="openModal('add')">
                ➕ 新しい在庫を追加
            </button>
        </div>

        <div class="alerts-section" id="alertsSection">
            <div class="alert-title">
                ⚠️ 在庫アラート
            </div>
            <div class="alert-list" id="alertList">
                <!-- アラートがここに動的に追加されます -->
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-number normal" id="totalItems">45</div>
                <div class="stat-label">総アイテム数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number low-stock" id="lowStockItems">7</div>
                <div class="stat-label">在庫不足</div>
            </div>
            <div class="stat-card">
                <div class="stat-number warning" id="warningItems">12</div>
                <div class="stat-label">警告レベル</div>
            </div>
            <div class="stat-card">
                <div class="stat-number normal" id="normalItems">26</div>
                <div class="stat-label">正常在庫</div>
            </div>
        </div>

        <div class="search-filters">
            <input type="text" class="search-input" placeholder="在庫を検索..." id="searchInput" onkeyup="filterInventory()">
            <select class="filter-select" id="categoryFilter" onchange="filterInventory()">
                <option value="">すべてのカテゴリ</option>
                <option value="野菜">野菜</option>
                <option value="肉類">肉類</option>
                <option value="魚介類">魚介類</option>
                <option value="調味料">調味料</option>
                <option value="米・麺類">米・麺類</option>
                <option value="飲料">飲料</option>
                <option value="その他">その他</option>
            </select>
            <select class="filter-select" id="statusFilter" onchange="filterInventory()">
                <option value="">すべてのステータス</option>
                <option value="normal">正常</option>
                <option value="warning">警告</option>
                <option value="low">在庫不足</option>
            </select>
        </div>

        <div class="inventory-grid" id="inventoryGrid">
            <!-- 在庫アイテムがここに動的に追加されます -->
        </div>
    </div>

    <!-- 在庫追加/編集モーダル -->
    <div class="modal" id="inventoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">在庫を追加</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <form id="inventoryForm">
                <div class="form-group">
                    <label class="form-label">商品名</label>
                    <input type="text" class="form-input" id="itemName" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">カテゴリ</label>
                    <select class="form-input" id="itemCategory" required>
                        <option value="">選択してください</option>
                        <option value="野菜">野菜</option>
                        <option value="肉類">肉類</option>
                        <option value="魚介類">魚介類</option>
                        <option value="調味料">調味料</option>
                        <option value="米・麺類">米・麺類</option>
                        <option value="飲料">飲料</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">現在の在庫数</label>
                    <input type="number" class="form-input" id="currentStock" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">最小在庫数</label>
                    <input type="number" class="form-input" id="minStock" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">最大在庫数</label>
                    <input type="number" class="form-input" id="maxStock" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">単位</label>
                    <input type="text" class="form-input" id="unit" placeholder="kg, 個, 本, etc." required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">仕入先</label>
                    <input type="text" class="form-input" id="supplier">
                </div>
                
                <div class="form-group">
                    <label class="form-label">単価 (円)</label>
                    <input type="number" class="form-input" id="unitPrice">
                </div>
                
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal()">キャンセル</button>
                    <button type="submit" class="save-btn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let inventory = [
            {
                id: 1,
                name: '豚バラ肉',
                category: '肉類',
                currentStock: 2,
                minStock: 5,
                maxStock: 20,
                unit: 'kg',
                supplier: '肉の田中',
                unitPrice: 1500,
                lastUpdated: '2024-01-20'
            },
            {
                id: 2,
                name: 'キャベツ',
                category: '野菜',
                currentStock: 8,
                minStock: 10,
                maxStock: 30,
                unit: '個',
                supplier: '野菜の鈴木',
                unitPrice: 200,
                lastUpdated: '2024-01-19'
            },
            {
                id: 3,
                name: '醤油',
                category: '調味料',
                currentStock: 15,
                minStock: 5,
                maxStock: 25,
                unit: '本',
                supplier: '調味料商店',
                unitPrice: 300,
                lastUpdated: '2024-01-18'
            },
            {
                id: 4,
                name: 'ラーメン麺',
                category: '米・麺類',
                currentStock: 3,
                minStock: 10,
                maxStock: 50,
                unit: 'kg',
                supplier: '麺の山田',
                unitPrice: 800,
                lastUpdated: '2024-01-20'
            },
            {
                id: 5,
                name: 'ビール',
                category: '飲料',
                currentStock: 24,
                minStock: 12,
                maxStock: 48,
                unit: '本',
                supplier: 'ドリンク卸',
                unitPrice: 200,
                lastUpdated: '2024-01-21'
            },
            {
                id: 6,
                name: '卵',
                category: 'その他',
                currentStock: 60,
                minStock: 30,
                maxStock: 120,
                unit: '個',
                supplier: '卵の佐藤',
                unitPrice: 25,
                lastUpdated: '2024-01-19'
            }
        ];

        let editingItemId = null;

        function getStockStatus(item) {
            const percentage = (item.currentStock / item.maxStock) * 100;
            if (item.currentStock <= item.minStock) return 'low';
            if (percentage <= 30) return 'warning';
            return 'normal';
        }

        function renderInventory(inventoryToRender = inventory) {
            const grid = document.getElementById('inventoryGrid');
            
            if (inventoryToRender.length === 0) {
                grid.innerHTML = '<div style="text-align: center; padding: 50px; color: #666; grid-column: 1 / -1;">該当する在庫が見つかりません</div>';
                return;
            }

            grid.innerHTML = inventoryToRender.map(item => {
                const status = getStockStatus(item);
                const percentage = Math.min((item.currentStock / item.maxStock) * 100, 100);
                
                return `
                    <div class="inventory-card">
                        <div class="card-header">
                            <div>
                                <div class="item-name">${item.name}</div>
                                <div class="item-category">${item.category}</div>
                            </div>
                        </div>
                        
                        <div class="stock-info">
                            <div class="stock-amount ${status}">${item.currentStock}</div>
                            <div class="stock-unit">/${item.maxStock} ${item.unit}</div>
                        </div>
                        
                        <div class="stock-bar">
                            <div class="stock-fill ${status}" style="width: ${percentage}%"></div>
                        </div>
                        
                        <div class="item-details">
                            <div class="detail-row">
                                <span>最小在庫:</span>
                                <span>${item.minStock} ${item.unit}</span>
                            </div>
                            <div class="detail-row">
                                <span>仕入先:</span>
                                <span>${item.supplier}</span>
                            </div>
                            <div class="detail-row">
                                <span>単価:</span>
                                <span>¥${item.unitPrice}</span>
                            </div>
                            <div class="detail-row">
                                <span>更新日:</span>
                                <span>${formatDate(item.lastUpdated)}</span>
                            </div>
                        </div>
                        
                        <div class="card-actions">
                            <button class="action-btn update-btn" onclick="updateStock(${item.id})">在庫更新</button>
                            <button class="action-btn order-btn" onclick="orderItem(${item.id})">発注</button>
                            <button class="action-btn delete-btn" onclick="deleteItem(${item.id})">削除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            let lowStock = 0, warning = 0, normal = 0;
            
            inventory.forEach(item => {
                const status = getStockStatus(item);
                if (status === 'low') lowStock++;
                else if (status === 'warning') warning++;
                else normal++;
            });

            document.getElementById('totalItems').textContent = inventory.length;
            document.getElementById('lowStockItems').textContent = lowStock;
            document.getElementById('warningItems').textContent = warning;
            document.getElementById('normalItems').textContent = normal;
        }

        function updateAlerts() {
            const lowStockItems = inventory.filter(item => getStockStatus(item) === 'low');
            const alertList = document.getElementById('alertList');
            const alertsSection = document.getElementById('alertsSection');

            if (lowStockItems.length === 0) {
                alertsSection.style.display = 'none';
                return;
            }

            alertsSection.style.display = 'block';
            alertList.innerHTML = lowStockItems.map(item => 
                `<div class="alert-item">${item.name} - 残り${item.currentStock}${item.unit} (最小在庫: ${item.minStock}${item.unit})</div>`
            ).join('');
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ja-JP');
        }

        function filterInventory() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            const filteredInventory = inventory.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchTerm) || 
                                    item.supplier.toLowerCase().includes(searchTerm);
                const matchesCategory = !categoryFilter || item.category === categoryFilter;
                const matchesStatus = !statusFilter || getStockStatus(item) === statusFilter;

                return matchesSearch && matchesCategory && matchesStatus;
            });

            renderInventory(filteredInventory);
        }

        function openModal(mode, itemId = null) {
            const modal = document.getElementById('inventoryModal');
            const modalTitle = document.getElementById('modalTitle');
            const form = document.getElementById('inventoryForm');

            if (mode === 'add') {
                modalTitle.textContent = '在庫を追加';
                form.reset();
                editingItemId = null;
            } else if (mode === 'edit') {
                modalTitle.textContent = '在庫を編集';
                const item = inventory.find(i => i.id === itemId);
                if (item) {
                    document.getElementById('itemName').value = item.name;
                    document.getElementById('itemCategory').value = item.category;
                    document.getElementById('currentStock').value = item.currentStock;
                    document.getElementById('minStock').value = item.minStock;
                    document.getElementById('maxStock').value = item.maxStock;
                    document.getElementById('unit').value = item.unit;
                    document.getElementById('supplier').value = item.supplier;
                    document.getElementById('unitPrice').value = item.unitPrice;
                    editingItemId = itemId;
                }
            }

            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('inventoryModal').style.display = 'none';
            editingItemId = null;
        }

        function updateStock(itemId) {
            const item = inventory.find(i => i.id === itemId);
            if (item) {
                const newStock = prompt(`${item.name}の新しい在庫数を入力してください (現在: ${item.currentStock}${item.unit}):`);
                if (newStock !== null && !isNaN(newStock) && newStock >= 0) {
                    item.currentStock = parseInt(newStock);
                    item.lastUpdated = new Date().toISOString().split('T')[0];
                    renderInventory();
                    updateStats();
                    updateAlerts();
                    filterInventory();
                }
            }
        }

        function orderItem(itemId) {
            const item = inventory.find(i => i.id === itemId);
            if (item) {
                const orderAmount = item.maxStock - item.currentStock;
                if (confirm(`${item.name}を${orderAmount}${item.unit}発注しますか？\n仕入先: ${item.supplier}\n概算金額: ¥${(orderAmount * item.unitPrice).toLocaleString()}`)) {
                    alert('発注処理を開始しました。');
                }
            }
        }

        function deleteItem(itemId) {
            if (confirm('この在庫アイテムを削除してもよろしいですか？')) {
                inventory = inventory.filter(item => item.id !== itemId);
                renderInventory();
                updateStats();
                updateAlerts();
                filterInventory();
            }
        }

        document.getElementById('inventoryForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const itemData = {
                name: document.getElementById('itemName').value,
                category: document.getElementById('itemCategory').value,
                currentStock: parseInt(document.getElementById('currentStock').value),
                minStock: parseInt(document.getElementById('minStock').value),
                maxStock: parseInt(document.getElementById('maxStock').value),
                unit: document.getElementById('unit').value,
                supplier: document.getElementById('supplier').value,
                unitPrice: parseInt(document.getElementById('unitPrice').value) || 0,
                lastUpdated: new Date().toISOString().split('T')[0]
            };

            if (editingItemId) {
                const itemIndex = inventory.findIndex(i => i.id === editingItemId);
                if (itemIndex !== -1) {
                    inventory[itemIndex] = { ...inventory[itemIndex], ...itemData };
                }
            } else {
                const newItem = {
                    id: Date.now(),
                    ...itemData
                };
                inventory.push(newItem);
            }

            closeModal();
            renderInventory();
            updateStats();
            updateAlerts();
            filterInventory();
        });

        window.onclick = function(event) {
            const modal = document.getElementById('inventoryModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderInventory();
            updateStats();
            updateAlerts();
        });
    </script>
</body>
</html>
