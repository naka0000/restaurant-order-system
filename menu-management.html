<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー管理 - 飲食店管理システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }

        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 0;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 24px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            background: rgba(255,255,255,0.2);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            color: #1d1d1f;
        }

        .add-menu-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .search-filters {
            background: white;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            min-width: 200px;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-select {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .menu-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            transition: all 0.3s;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .menu-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(45deg, #f0f0f0, #e0e0e0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #999;
        }

        .menu-content {
            padding: 20px;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .menu-name {
            font-size: 20px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 5px;
        }

        .menu-price {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .menu-category {
            display: inline-block;
            background: #f0f0f2;
            color: #666;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .menu-description {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .menu-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }

        .menu-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .edit-btn {
            background: #e3f2fd;
            color: #1976d2;
        }

        .edit-btn:hover {
            background: #bbdefb;
        }

        .delete-btn {
            background: #ffebee;
            color: #d32f2f;
        }

        .delete-btn:hover {
            background: #ffcdd2;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-available {
            background: #d4edda;
            color: #155724;
        }

        .status-unavailable {
            background: #f8d7da;
            color: #721c24;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #1d1d1f;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            padding: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .cancel-btn {
            background: #f5f5f5;
            color: #666;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .save-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .header-section {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .search-filters {
                flex-direction: column;
                align-items: stretch;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-title">🍽️ レストラン管理システム</div>
            <div class="nav-links">
                <a href="index.html">注文管理</a>
                <a href="dashboard.html">ダッシュボード</a>
                <a href="menu-management.html" class="active">メニュー管理</a>
                <a href="customer-management.html">顧客管理</a>
                <a href="inventory.html">在庫管理</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1 class="header-title">メニュー管理</h1>
            <button class="add-menu-btn" onclick="openModal('add')">
                ➕ 新しいメニューを追加
            </button>
        </div>

        <div class="search-filters">
            <input type="text" class="search-input" placeholder="メニューを検索..." id="searchInput" onkeyup="filterMenus()">
            <select class="filter-select" id="categoryFilter" onchange="filterMenus()">
                <option value="">すべてのカテゴリ</option>
                <option value="ラーメン">ラーメン</option>
                <option value="定食">定食</option>
                <option value="丼物">丼物</option>
                <option value="サイド">サイド</option>
                <option value="ドリンク">ドリンク</option>
                <option value="デザート">デザート</option>
            </select>
            <select class="filter-select" id="statusFilter" onchange="filterMenus()">
                <option value="">すべてのステータス</option>
                <option value="available">提供中</option>
                <option value="unavailable">品切れ</option>
            </select>
        </div>

        <div class="menu-grid" id="menuGrid">
            <!-- メニューアイテムがここに動的に追加されます -->
        </div>
    </div>

    <!-- メニュー追加/編集モーダル -->
    <div class="modal" id="menuModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">メニューを追加</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <form id="menuForm">
                <div class="form-group">
                    <label class="form-label">メニュー名</label>
                    <input type="text" class="form-input" id="menuName" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">価格 (円)</label>
                    <input type="number" class="form-input" id="menuPrice" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">カテゴリ</label>
                    <select class="form-input" id="menuCategory" required>
                        <option value="">選択してください</option>
                        <option value="ラーメン">ラーメン</option>
                        <option value="定食">定食</option>
                        <option value="丼物">丼物</option>
                        <option value="サイド">サイド</option>
                        <option value="ドリンク">ドリンク</option>
                        <option value="デザート">デザート</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">説明</label>
                    <textarea class="form-input form-textarea" id="menuDescription" placeholder="メニューの説明を入力してください"></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">ステータス</label>
                    <select class="form-input" id="menuStatus">
                        <option value="available">提供中</option>
                        <option value="unavailable">品切れ</option>
                    </select>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal()">キャンセル</button>
                    <button type="submit" class="save-btn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let menus = [
            {
                id: 1,
                name: '醤油ラーメン',
                price: 800,
                category: 'ラーメン',
                description: '昔ながらの醤油ベースのあっさりラーメン',
                status: 'available',
                orders: 156,
                rating: 4.2
            },
            {
                id: 2,
                name: '味噌ラーメン',
                price: 850,
                category: 'ラーメン',
                description: '濃厚な味噌スープが自慢の一杯',
                status: 'available',
                orders: 98,
                rating: 4.5
            },
            {
                id: 3,
                name: '餃子セット',
                price: 600,
                category: 'サイド',
                description: '手作り餃子6個セット',
                status: 'available',
                orders: 203,
                rating: 4.7
            },
            {
                id: 4,
                name: 'チャーハン',
                price: 700,
                category: '丼物',
                description: 'パラパラに炒めた本格チャーハン',
                status: 'unavailable',
                orders: 87,
                rating: 4.1
            },
            {
                id: 5,
                name: '生ビール',
                price: 500,
                category: 'ドリンク',
                description: 'キンキンに冷えた生ビール',
                status: 'available',
                orders: 312,
                rating: 4.8
            },
            {
                id: 6,
                name: 'アイスクリーム',
                price: 300,
                category: 'デザート',
                description: 'バニラアイスクリーム',
                status: 'available',
                orders: 45,
                rating: 4.0
            }
        ];

        let editingMenuId = null;

        function renderMenus(menusToRender = menus) {
            const menuGrid = document.getElementById('menuGrid');
            
            if (menusToRender.length === 0) {
                menuGrid.innerHTML = '<div style="text-align: center; padding: 50px; color: #666; grid-column: 1 / -1;">該当するメニューが見つかりません</div>';
                return;
            }

            menuGrid.innerHTML = menusToRender.map(menu => `
                <div class="menu-card">
                    <div class="menu-image">🍜</div>
                    <div class="menu-content">
                        <div class="menu-header">
                            <div>
                                <div class="menu-name">${menu.name}</div>
                                <div class="menu-category">${menu.category}</div>
                            </div>
                            <div class="menu-price">¥${menu.price.toLocaleString()}</div>
                        </div>
                        
                        <div class="menu-description">${menu.description}</div>
                        
                        <div class="menu-stats">
                            <span>📊 ${menu.orders}回注文</span>
                            <span>⭐ ${menu.rating}</span>
                            <span class="status-badge ${menu.status === 'available' ? 'status-available' : 'status-unavailable'}">
                                ${menu.status === 'available' ? '提供中' : '品切れ'}
                            </span>
                        </div>
                        
                        <div class="menu-actions">
                            <button class="action-btn edit-btn" onclick="editMenu(${menu.id})">編集</button>
                            <button class="action-btn delete-btn" onclick="deleteMenu(${menu.id})">削除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterMenus() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            const filteredMenus = menus.filter(menu => {
                const matchesSearch = menu.name.toLowerCase().includes(searchTerm) || 
                                    menu.description.toLowerCase().includes(searchTerm);
                const matchesCategory = !categoryFilter || menu.category === categoryFilter;
                const matchesStatus = !statusFilter || menu.status === statusFilter;

                return matchesSearch && matchesCategory && matchesStatus;
            });

            renderMenus(filteredMenus);
        }

        function openModal(mode, menuId = null) {
            const modal = document.getElementById('menuModal');
            const modalTitle = document.getElementById('modalTitle');
            const form = document.getElementById('menuForm');

            if (mode === 'add') {
                modalTitle.textContent = 'メニューを追加';
                form.reset();
                editingMenuId = null;
            } else if (mode === 'edit') {
                modalTitle.textContent = 'メニューを編集';
                const menu = menus.find(m => m.id === menuId);
                if (menu) {
                    document.getElementById('menuName').value = menu.name;
                    document.getElementById('menuPrice').value = menu.price;
                    document.getElementById('menuCategory').value = menu.category;
                    document.getElementById('menuDescription').value = menu.description;
                    document.getElementById('menuStatus').value = menu.status;
                    editingMenuId = menuId;
                }
            }

            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('menuModal').style.display = 'none';
            editingMenuId = null;
        }

        function editMenu(menuId) {
            openModal('edit', menuId);
        }

        function deleteMenu(menuId) {
            if (confirm('このメニューを削除してもよろしいですか？')) {
                menus = menus.filter(menu => menu.id !== menuId);
                renderMenus();
                filterMenus();
            }
        }

        document.getElementById('menuForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const menuData = {
                name: document.getElementById('menuName').value,
                price: parseInt(document.getElementById('menuPrice').value),
                category: document.getElementById('menuCategory').value,
                description: document.getElementById('menuDescription').value,
                status: document.getElementById('menuStatus').value
            };

            if (editingMenuId) {
                const menuIndex = menus.findIndex(m => m.id === editingMenuId);
                if (menuIndex !== -1) {
                    menus[menuIndex] = { ...menus[menuIndex], ...menuData };
                }
            } else {
                const newMenu = {
                    id: Date.now(),
                    ...menuData,
                    orders: 0,
                    rating: 0
                };
                menus.push(newMenu);
            }

            closeModal();
            renderMenus();
            filterMenus();
        });

        window.onclick = function(event) {
            const modal = document.getElementById('menuModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderMenus();
        });
    </script>
</body>
</html>
